<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koey Links | Managed Link Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F0F9FF;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen py-6 px-4 flex flex-col justify-between items-center bg-[#F0F9FF]">

  <div class="w-full max-w-md bg-white rounded-[36px] shadow-2xl border-4 border-sky-200 overflow-hidden relative flex flex-col min-h-[640px]">
    
    <!-- Top Mascot Banner -->
    <div class="bg-sky-100 p-4 border-b-2 border-sky-200 flex justify-between items-center relative">
      <div class="flex items-center gap-1.5">
        <div class="w-8 h-8 bg-white rounded-full p-0.5 shadow-sm border border-sky-300">
          <svg viewBox="0 0 120 120" class="w-full h-full">
            <ellipse cx="60" cy="65" rx="42" ry="38" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="4" />
            <ellipse cx="44" cy="62" rx="4" ry="5.5" fill="#2D2D2D" />
            <ellipse cx="76" cy="62" rx="4" ry="5.5" fill="#2D2D2D" />
            <ellipse cx="32" cy="74" rx="8" ry="5" fill="#FFB7B2" opacity="0.7" />
            <ellipse cx="88" cy="74" rx="8" ry="5" fill="#FFB7B2" opacity="0.7" />
            <path d="M57 69 Q 60 66 63 69" fill="none" stroke="#4A4A4A" stroke-width="3" />
          </svg>
        </div>
        <div class="w-8 h-8 bg-white rounded-full p-0.5 shadow-sm border border-sky-300">
          <svg viewBox="0 0 120 120" class="w-full h-full">
            <ellipse cx="60" cy="65" rx="44" ry="38" fill="#4CAF50" stroke="#2E7D32" stroke-width="4" />
            <circle cx="36" cy="65" r="15" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="3" />
            <circle cx="84" cy="65" r="15" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="3" />
            <circle cx="38" cy="65" r="3.5" fill="#2D2D2D" />
            <circle cx="82" cy="65" r="3.5" fill="#2D2D2D" />
            <path d="M52 82 Q 60 88 68 82" fill="none" stroke="#2D2D2D" stroke-width="3" />
          </svg>
        </div>
      </div>
      
      <button onclick="toggleAdminPanel()" class="bg-sky-200 hover:bg-sky-300 text-sky-800 text-xs font-bold px-3 py-1 rounded-xl transition duration-150 border border-sky-300">
        ⚙️ Manage Live
      </button>
    </div>

    <!-- Alert Banner inside view -->
    <div id="alertBox" class="hidden mx-4 mt-3 p-3 text-xs font-bold text-center rounded-xl border transition-all duration-200"></div>

    <!-- Loader -->
    <div id="loader" class="hidden absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center space-y-3">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-sky-500 border-t-transparent"></div>
      <p class="text-xs font-bold text-sky-800">Updating live Google Sheet...</p>
    </div>

    <!-- MAIN VIEW MODE -->
    <div id="userView" class="flex-1 flex flex-col">
      <!-- Profile Area -->
      <div class="px-6 pt-6 pb-2 text-center">
        <div class="relative w-20 h-20 mx-auto mb-3 bg-sky-50 rounded-full border-4 border-sky-300 flex items-center justify-center shadow-md">
          <span class="text-3xl">✨</span>
        </div>
        <h1 id="profileName" class="text-xl font-bold text-sky-950">Koey Links</h1>
        <p id="profileBio" class="text-xs text-sky-700/80 mt-1.5 font-medium px-4"></p>
      </div>

      <!-- Search Bar -->
      <div class="px-6 my-3">
        <div class="relative">
          <input 
            type="text" 
            id="searchBox"
            placeholder="Search links..." 
            class="w-full pl-9 pr-4 py-2 bg-sky-50/50 border border-sky-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-sky-400 text-sky-900 placeholder-sky-400"
            oninput="filterLinks()"
          />
          <span class="absolute left-3 top-2.5 text-xs">🔍</span>
        </div>
      </div>

      <!-- Dynamic Links -->
      <div class="px-6 pb-6 space-y-5 flex-1 overflow-y-auto custom-scroll" id="linksContainer">
         <!-- Links rendered dynamically -->
      </div>
    </div>

    <!-- ADMIN PANEL MODE (Hidden by default) -->
    <div id="adminView" class="hidden flex-1 p-6 flex flex-col">
      <div class="flex items-center justify-between border-b pb-3 mb-4 border-sky-100">
        <h2 class="font-black text-sky-950 text-base">✏️ Live Admin Portal</h2>
        <button onclick="toggleAdminPanel()" class="text-xs text-slate-500 hover:text-sky-600 font-bold">← Back</button>
      </div>

      <!-- PIN verification form -->
      <div id="pinScreen" class="space-y-4 my-auto">
        <p class="text-xs font-bold text-sky-800 text-center">Enter your Admin PIN to start adding or deleting links dynamically:</p>
        <div class="max-w-[200px] mx-auto space-y-2">
          <input type="password" id="adminPinInput" placeholder="••••" class="w-full text-center tracking-widest px-4 py-2.5 border rounded-xl text-lg font-bold focus:outline-sky-400" />
          <button onclick="verifyPinAndLoad()" class="w-full bg-sky-600 hover:bg-sky-700 text-white py-2 text-xs font-bold rounded-xl shadow-sm">
            Unlock Board
          </button>
        </div>
      </div>

      <!-- Logged-in admin workspace -->
      <div id="adminWorkspace" class="hidden flex-1 flex flex-col space-y-4">
        
        <!-- Quick Profile Form -->
        <div class="bg-sky-50/40 p-3 rounded-2xl border border-sky-100 space-y-2">
          <span class="text-[10px] font-black uppercase text-sky-800 tracking-wider">Update Profile Information</span>
          <input type="text" id="editProfileName" placeholder="Profile Title" class="w-full px-3 py-1.5 border text-xs rounded-lg" />
          <input type="text" id="editProfileBio" placeholder="Short Bio/Tagline" class="w-full px-3 py-1.5 border text-xs rounded-lg" />
          <button onclick="submitProfileUpdate()" class="w-full bg-slate-800 hover:bg-black text-white text-[10px] font-bold py-1.5 rounded-lg">Save Profile Settings</button>
        </div>

        <!-- Add Link Form -->
        <div class="bg-sky-50/40 p-3 rounded-2xl border border-sky-100 space-y-2">
          <span class="text-[10px] font-black uppercase text-sky-800 tracking-wider" id="formHeader">Insert New Link</span>
          <input type="hidden" id="editLinkId" />
          <input type="text" id="editLinkTitle" placeholder="Link Title" class="w-full px-3 py-1.5 border text-xs rounded-lg" />
          <input type="text" id="editLinkUrl" placeholder="https://..." class="w-full px-3 py-1.5 border text-xs rounded-lg" />
          <input type="text" id="editLinkCategory" placeholder="Category (e.g. Social, Contact)" class="w-full px-3 py-1.5 border text-xs rounded-lg" />
          
          <div class="flex gap-2">
            <button onclick="submitLinkLive()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold py-2 rounded-xl">Save Link</button>
            <button onclick="cancelEditMode()" id="cancelEditBtn" class="hidden bg-slate-300 hover:bg-slate-400 text-slate-800 text-xs font-bold px-3 rounded-xl">Cancel</button>
          </div>
        </div>

        <!-- Admin Links Mini Management List -->
        <div class="flex-1 overflow-y-auto max-h-[160px] custom-scroll space-y-2 bg-slate-50 p-2 rounded-xl border border-slate-100" id="adminLinksList">
          <!-- Populated dynamically -->
        </div>

      </div>
    </div>

  </div>

  <!-- Footer attribution -->
  <div class="text-center mt-4 text-[10px] text-sky-600/70 font-semibold flex items-center gap-1">
    <span>Made with 💙 & Deployed via Google Sheets Database</span>
  </div>

  <script>
    let localDb = {
      profileName: "Koey Links",
      profileBio: "",
      links: [{"id":"1782363834608","title":"MC Analysis","url":"https://docs.google.com/spreadsheets/d/1yELj0ZLpXJ_cnbxUshWNDISNVWJscdMdSTR3iGLlUYk/edit","category":"Exam","clicks":0,"active":true},{"id":"1782363805462","title":"MC Scanner","url":"https://sites.google.com/cch.edu.hk/mc-scanner/mc","category":"Exam","clicks":0,"active":true},{"id":"1782363789973","title":"JPG to PDF","url":"https://sites.google.com/cch.edu.hk/mc-scanner/jpg-to-pdf","category":"Exam","clicks":0,"active":true},{"id":"1782363761008","title":"QR Code Generator","url":"https://script.google.com/a/macros/cch.edu.hk/s/AKfycbwU3ktJLf9ImW-pwsmqbYXmA7D4gFPd_D8OhQtnPLLai6qmolneaSKyB7F5QkNJIDNpcw/exec","category":"Admin","clicks":0,"active":true},{"id":"1782363697343","title":"Volume of Cones and Pyramids","url":"https://sites.google.com/d/1WcjXq8NFPHRSrpD1dTX-VMgkfV41I-fQ/p/1Nm8pi3fUCS93Dm35O7YGc166Ha_Z7INH/edit","category":"Teaching Resources","clicks":0,"active":true}]
    };

    let activeAdminPin = "";

    function showStatus(msg, isError = false) {
      const box = document.getElementById('alertBox');
      box.innerText = msg;
      box.className = isError 
        ? "mx-4 mt-3 p-3 text-xs font-bold text-center rounded-xl border bg-rose-50 border-rose-200 text-rose-800 block"
        : "mx-4 mt-3 p-3 text-xs font-bold text-center rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800 block";
      setTimeout(() => box.className = "hidden", 4000);
    }

    function toggleLoader(show) {
      const loader = document.getElementById('loader');
      loader.className = show 
        ? "absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center space-y-3"
        : "hidden";
    }

    function toggleAdminPanel() {
      const userView = document.getElementById('userView');
      const adminView = document.getElementById('adminView');
      if (adminView.classList.contains('hidden')) {
        adminView.classList.remove('hidden');
        userView.classList.add('hidden');
      } else {
        adminView.classList.add('hidden');
        userView.classList.remove('hidden');
      }
    }

    function verifyPinAndLoad() {
      const pin = document.getElementById('adminPinInput').value;
      if (pin === "0115") {
        activeAdminPin = pin;
        document.getElementById('pinScreen').classList.add('hidden');
        document.getElementById('adminWorkspace').classList.remove('hidden');
        
        // Populate inputs
        document.getElementById('editProfileName').value = localDb.profileName;
        document.getElementById('editProfileBio').value = localDb.profileBio;
        
        renderAdminLinks();
        showStatus("Admin Panel Unlocked successfully!");
      } else {
        showStatus("Invalid PIN, please check App.jsx parameters.", true);
      }
    }

    function renderPage() {
      // Set profile text
      document.getElementById('profileName').innerText = localDb.profileName;
      document.getElementById('profileBio').innerText = localDb.profileBio;

      const container = document.getElementById('linksContainer');
      container.innerHTML = '';

      // Group active links
      const activeLinks = localDb.links.filter(l => l.active);
      const categories = {};
      activeLinks.forEach(link => {
        if (!categories[link.category]) categories[link.category] = [];
        categories[link.category].push(link);
      });

      if (activeLinks.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-sky-400 py-6">No links currently configured on this board.</p>';
        return;
      }

      Object.keys(categories).forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = 'space-y-2';

        const title = document.createElement('h3');
        title.className = 'text-[10px] font-black uppercase tracking-wider text-sky-500 pl-1';
        title.innerText = cat;
        catDiv.appendChild(title);

        categories[cat].forEach(link => {
          const card = document.createElement('a');
          card.href = link.url;
          card.target = "_blank";
          card.className = "flex items-center justify-between p-3.5 bg-white hover:bg-sky-50/50 border border-sky-100 hover:border-sky-300 rounded-2xl shadow-sm transition duration-150 transform active:scale-95 group";
          
          const left = document.createElement('div');
          left.className = "min-w-0 flex-1 pr-3";
          
          const t = document.createElement('h4');
          t.className = "font-extrabold text-sky-950 text-xs sm:text-sm group-hover:text-sky-700 truncate";
          t.innerText = link.title;
          
          const u = document.createElement('p');
          u.className = "text-[9px] text-sky-400 mt-0.5 truncate font-mono";
          u.innerText = link.url;

          left.appendChild(t);
          left.appendChild(u);

          const r = document.createElement('span');
          r.className = "text-sky-300 group-hover:text-sky-500 text-xs";
          r.innerText = "⚡";

          card.appendChild(left);
          card.appendChild(r);

          // Click reporting
          card.onclick = () => {
            if (typeof google !== 'undefined') {
              google.script.run.registerClick(link.id);
            }
          };

          catDiv.appendChild(card);
        });

        container.appendChild(catDiv);
      });
    }

    function renderAdminLinks() {
      const list = document.getElementById('adminLinksList');
      list.innerHTML = '';
      localDb.links.forEach(link => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2 bg-white rounded-lg border border-slate-100 text-xs";
        row.innerHTML = `
          <div class="truncate flex-1 pr-2">
            <strong class="text-slate-800">${link.title}</strong>
            <p class="text-[9px] text-slate-400 truncate">${link.url}</p>
          </div>
          <div class="flex gap-1">
            <button onclick="editLinkMode('${link.id}')" class="bg-sky-100 text-sky-800 px-2 py-1 rounded hover:bg-sky-200">✏️</button>
            <button onclick="deleteLinkLiveFromServer('${link.id}')" class="bg-rose-50 text-rose-700 px-2 py-1 rounded hover:bg-rose-100">🗑️</button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function filterLinks() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      const allCards = document.getElementById('linksContainer').querySelectorAll('a');
      allCards.forEach(c => {
        const title = c.querySelector('h4').innerText.toLowerCase();
        const url = c.querySelector('p').innerText.toLowerCase();
        if (title.includes(q) || url.includes(q)) {
          c.classList.remove('hidden');
        } else {
          c.classList.add('hidden');
        }
      });
    }

    // --- LIVE INTEGRATED SERVER MUTATIONS (GAS EXECUTIONS) ---
    function syncFromServerResponse(response) {
      localDb = response;
      renderPage();
      if (activeAdminPin) {
        renderAdminLinks();
      }
    }

    function submitProfileUpdate() {
      const name = document.getElementById('editProfileName').value;
      const bio = document.getElementById('editProfileBio').value;
      
      toggleLoader(true);
      if (typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler((res) => {
            syncFromServerResponse(res);
            toggleLoader(false);
            showStatus("Profile details updated inside Google Sheet!");
          })
          .withFailureHandler((err) => {
            toggleLoader(false);
            showStatus("Failed: " + err.message, true);
          })
          .updateProfileLive(activeAdminPin, name, bio);
      } else {
        // Mock offline fallback
        localDb.profileName = name;
        localDb.profileBio = bio;
        renderPage();
        toggleLoader(false);
        showStatus("Offline Mock Profile Saved!");
      }
    }

    function submitLinkLive() {
      const id = document.getElementById('editLinkId').value || Date.now().toString();
      const title = document.getElementById('editLinkTitle').value;
      const url = document.getElementById('editLinkUrl').value;
      const category = document.getElementById('editLinkCategory').value || "General";

      if (!title || !url) {
        showStatus("Please enter title and URL.", true);
        return;
      }

      const payload = { id, title, url, category, active: true };

      toggleLoader(true);
      if (typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler((res) => {
            syncFromServerResponse(res);
            toggleLoader(false);
            cancelEditMode();
            showStatus("Link saved inside Google Sheets successfully!");
          })
          .withFailureHandler((err) => {
            toggleLoader(false);
            showStatus("Save Failed: " + err.message, true);
          })
          .saveLinkLive(activeAdminPin, payload);
      } else {
        // Offline Mock Fallback
        const idx = localDb.links.findIndex(l => l.id === id);
        if (idx !== -1) {
          localDb.links[idx] = payload;
        } else {
          localDb.links.push(payload);
        }
        renderPage();
        renderAdminLinks();
        cancelEditMode();
        toggleLoader(false);
        showStatus("Offline Mock: Link saved!");
      }
    }

    function deleteLinkLiveFromServer(id) {
      if (!confirm("Are you sure you want to delete this link forever?")) return;
      toggleLoader(true);
      if (typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler((res) => {
            syncFromServerResponse(res);
            toggleLoader(false);
            showStatus("Link deleted from Google Sheets!");
          })
          .withFailureHandler((err) => {
            toggleLoader(false);
            showStatus("Delete failed: " + err.message, true);
          })
          .deleteLinkLive(activeAdminPin, id);
      } else {
        localDb.links = localDb.links.filter(l => l.id !== id);
        renderPage();
        renderAdminLinks();
        toggleLoader(false);
        showStatus("Offline Mock: Link deleted!");
      }
    }

    function editLinkMode(id) {
      const link = localDb.links.find(l => l.id === id);
      if (!link) return;

      document.getElementById('formHeader').innerText = "Edit Link Details";
      document.getElementById('editLinkId').value = link.id;
      document.getElementById('editLinkTitle').value = link.title;
      document.getElementById('editLinkUrl').value = link.url;
      document.getElementById('editLinkCategory').value = link.category;

      document.getElementById('cancelEditBtn').classList.remove('hidden');
    }

    function cancelEditMode() {
      document.getElementById('formHeader').innerText = "Insert New Link";
      document.getElementById('editLinkId').value = "";
      document.getElementById('editLinkTitle').value = "";
      document.getElementById('editLinkUrl').value = "";
      document.getElementById('editLinkCategory').value = "General";

      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    // Initialize Database on runtime load
    window.onload = function() {
      if (typeof google !== 'undefined') {
        toggleLoader(true);
        google.script.run
          .withSuccessHandler((res) => {
            syncFromServerResponse(res);
            toggleLoader(false);
          })
          .withFailureHandler((err) => {
            toggleLoader(false);
            showStatus("Error reading database: " + err.message, true);
          })
          .getLiveDatabase();
      } else {
        renderPage();
      }
    }
  </script>
</body>
</html>
